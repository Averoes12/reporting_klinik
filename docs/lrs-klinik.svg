<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1350" viewBox="0 0 1800 1350">
  <defs>
    <style>
      .bg { fill: #fbfcfe; }
      .title { font: 700 34px Arial, sans-serif; fill: #102a43; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #52616b; }
      .table { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 8; }
      .head { fill: #1f2937; }
      .name { font: 700 18px Arial, sans-serif; fill: #ffffff; letter-spacing: 0; }
      .field { font: 15px Arial, sans-serif; fill: #243b53; }
      .pk { font: 700 15px Arial, sans-serif; fill: #0b7285; }
      .fk { font: 700 15px Arial, sans-serif; fill: #9c4221; }
      .line { stroke: #52616b; stroke-width: 2.3; fill: none; }
      .label { font: 700 14px Arial, sans-serif; fill: #102a43; }
      .legend { fill: #ffffff; stroke: #bcccdc; stroke-width: 1.5; rx: 8; }
      .legend-text { font: 15px Arial, sans-serif; fill: #334e68; }
    </style>
    <marker id="arrow-lrs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52616b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1350"/>
  <text class="title" x="60" y="58">LRS Aplikasi Reporting Klinik</text>
  <text class="subtitle" x="60" y="88">Logical Record Structure: daftar record, primary key, foreign key, dan arah referensi antar tabel.</text>

  <g id="legend">
    <rect class="legend" x="1270" y="38" width="470" height="80"/>
    <text class="legend-text" x="1290" y="68"><tspan class="pk">PK</tspan> = Primary Key</text>
    <text class="legend-text" x="1290" y="96"><tspan class="fk">FK</tspan> = Foreign Key, mereferensi tabel lain</text>
  </g>

  <!-- Row 1 -->
  <g id="lrs-pasien">
    <rect class="table" x="60" y="150" width="380" height="265"/>
    <rect class="head" x="60" y="150" width="380" height="42" rx="8"/>
    <text class="name" x="80" y="177">pasien</text>
    <text class="pk" x="80" y="220">PK id_pasien : INT</text>
    <text class="field" x="80" y="246">no_rm : VARCHAR(20), UNIQUE</text>
    <text class="field" x="80" y="272">nik : VARCHAR(20)</text>
    <text class="field" x="80" y="298">nama_pasien : VARCHAR(100)</text>
    <text class="field" x="80" y="324">jenis_kelamin : ENUM('L','P')</text>
    <text class="field" x="80" y="350">tanggal_lahir : DATE</text>
    <text class="field" x="80" y="376">alamat : TEXT</text>
    <text class="field" x="80" y="402">no_hp, alergi, created_at</text>
  </g>

  <g id="lrs-poli">
    <rect class="table" x="710" y="150" width="330" height="140"/>
    <rect class="head" x="710" y="150" width="330" height="42" rx="8"/>
    <text class="name" x="730" y="177">poli</text>
    <text class="pk" x="730" y="220">PK id_poli : INT</text>
    <text class="field" x="730" y="246">nama_poli : VARCHAR(100)</text>
  </g>

  <g id="lrs-dokter">
    <rect class="table" x="1320" y="150" width="380" height="245"/>
    <rect class="head" x="1320" y="150" width="380" height="42" rx="8"/>
    <text class="name" x="1340" y="177">dokter</text>
    <text class="pk" x="1340" y="220">PK id_dokter : INT</text>
    <text class="field" x="1340" y="246">kode_dokter : VARCHAR(20), UNIQUE</text>
    <text class="field" x="1340" y="272">nama_dokter : VARCHAR(100)</text>
    <text class="fk" x="1340" y="298">FK id_poli : INT -&gt; poli.id_poli</text>
    <text class="field" x="1340" y="324">no_hp : VARCHAR(20)</text>
    <text class="field" x="1340" y="350">alamat : TEXT</text>
    <text class="field" x="1340" y="376">status : ENUM('Aktif','Nonaktif')</text>
  </g>

  <!-- Row 2 -->
  <g id="lrs-obat">
    <rect class="table" x="60" y="535" width="410" height="310"/>
    <rect class="head" x="60" y="535" width="410" height="42" rx="8"/>
    <text class="name" x="80" y="562">obat</text>
    <text class="pk" x="80" y="605">PK id_obat : INT</text>
    <text class="field" x="80" y="631">kode_obat : VARCHAR(30), UNIQUE</text>
    <text class="field" x="80" y="657">nama_obat : VARCHAR(150)</text>
    <text class="field" x="80" y="683">satuan : VARCHAR(30)</text>
    <text class="field" x="80" y="709">harga : DECIMAL(12,2)</text>
    <text class="field" x="80" y="735">stok_awal : INT</text>
    <text class="field" x="80" y="761">stok_masuk : INT</text>
    <text class="field" x="80" y="787">stok_retur : INT</text>
    <text class="field" x="80" y="813">stok_akhir : INT</text>
    <text class="field" x="80" y="839">tanggal_expired : DATE</text>
  </g>

  <g id="lrs-kunjungan">
    <rect class="table" x="680" y="500" width="430" height="355"/>
    <rect class="head" x="680" y="500" width="430" height="42" rx="8"/>
    <text class="name" x="700" y="527">kunjungan</text>
    <text class="pk" x="700" y="570">PK id_kunjungan : INT</text>
    <text class="field" x="700" y="596">no_kunjungan : VARCHAR(30), UNIQUE</text>
    <text class="fk" x="700" y="622">FK id_pasien : INT -&gt; pasien.id_pasien</text>
    <text class="fk" x="700" y="648">FK id_dokter : INT -&gt; dokter.id_dokter</text>
    <text class="fk" x="700" y="674">FK id_poli : INT -&gt; poli.id_poli</text>
    <text class="field" x="700" y="700">tanggal_kunjungan : DATE</text>
    <text class="field" x="700" y="726">keluhan : TEXT</text>
    <text class="field" x="700" y="752">diagnosa : TEXT</text>
    <text class="field" x="700" y="778">tindakan : TEXT</text>
    <text class="field" x="700" y="804">status : ENUM(...)</text>
  </g>

  <g id="lrs-jadwal">
    <rect class="table" x="1320" y="510" width="380" height="270"/>
    <rect class="head" x="1320" y="510" width="380" height="42" rx="8"/>
    <text class="name" x="1340" y="537">jadwal_dokter</text>
    <text class="pk" x="1340" y="580">PK id_jadwal : INT</text>
    <text class="fk" x="1340" y="606">FK id_dokter : INT -&gt; dokter.id_dokter</text>
    <text class="fk" x="1340" y="632">FK id_poli : INT -&gt; poli.id_poli</text>
    <text class="field" x="1340" y="658">hari : ENUM('Senin',...)</text>
    <text class="field" x="1340" y="684">jam_mulai : TIME</text>
    <text class="field" x="1340" y="710">jam_selesai : TIME</text>
    <text class="field" x="1340" y="736">kuota : INT</text>
  </g>

  <!-- Row 3 -->
  <g id="lrs-mutasi">
    <rect class="table" x="60" y="980" width="410" height="245"/>
    <rect class="head" x="60" y="980" width="410" height="42" rx="8"/>
    <text class="name" x="80" y="1007">stok_obat_mutasi</text>
    <text class="pk" x="80" y="1050">PK id_mutasi : INT</text>
    <text class="fk" x="80" y="1076">FK id_obat : INT -&gt; obat.id_obat</text>
    <text class="field" x="80" y="1102">tanggal_mutasi : DATE</text>
    <text class="field" x="80" y="1128">jenis_mutasi : ENUM('MASUK','KELUAR',...)</text>
    <text class="field" x="80" y="1154">jumlah : INT</text>
    <text class="field" x="80" y="1180">keterangan : TEXT</text>
  </g>

  <g id="lrs-resep">
    <rect class="table" x="680" y="990" width="370" height="180"/>
    <rect class="head" x="680" y="990" width="370" height="42" rx="8"/>
    <text class="name" x="700" y="1017">resep</text>
    <text class="pk" x="700" y="1060">PK id_resep : INT</text>
    <text class="fk" x="700" y="1086">FK id_kunjungan : INT -&gt; kunjungan.id_kunjungan</text>
    <text class="field" x="700" y="1112">tanggal_resep : DATE</text>
    <text class="field" x="700" y="1138">catatan : TEXT</text>
  </g>

  <g id="lrs-resep-detail">
    <rect class="table" x="1320" y="940" width="420" height="285"/>
    <rect class="head" x="1320" y="940" width="420" height="42" rx="8"/>
    <text class="name" x="1340" y="967">resep_detail</text>
    <text class="pk" x="1340" y="1010">PK id_resep_detail : INT</text>
    <text class="fk" x="1340" y="1036">FK id_resep : INT -&gt; resep.id_resep</text>
    <text class="fk" x="1340" y="1062">FK id_obat : INT -&gt; obat.id_obat</text>
    <text class="field" x="1340" y="1088">jumlah : INT</text>
    <text class="field" x="1340" y="1114">aturan_pakai : VARCHAR(100)</text>
    <text class="field" x="1340" y="1140">harga_satuan : DECIMAL(12,2)</text>
    <text class="field" x="1340" y="1166">subtotal : DECIMAL(12,2)</text>
  </g>

  <!-- Reference arrows: child FK points to parent PK -->
  <path class="line" d="M1320 297 C1190 297 1160 220 1040 220" marker-end="url(#arrow-lrs)"/>
  <text class="label" x="1140" y="278">dokter.id_poli</text>

  <path class="line" d="M680 622 C545 622 555 285 440 285" marker-end="url(#arrow-lrs)"/>
  <text class="label" x="500" y="455">kunjungan.id_pasien</text>

  <path class="line" d="M1110 648 C1235 648 1190 272 1320 272" marker-end="url(#arrow-lrs)"/>
  <text class="label" x="1135" y="465">kunjungan.id_dokter</text>

  <path class="line" d="M900 500 C900 390 875 340 875 290" marker-end="url(#arrow-lrs)"/>
  <text class="label" x="915" y="410">kunjungan.id_poli</text>

  <path class="line" d="M1320 606 C1200 606 1190 350 1510 395" marker-end="url(#arrow-lrs)"/>
  <text class="label" x="1210" y="500">jadwal.id_dokter</text>

  <path class="line" d="M1320 632 C1195 632 1195 240 1040 240" marker-end="url(#arrow-lrs)"/>
  <text class="label" x="1140" y="605">jadwal.id_poli</text>

  <path class="line" d="M865 990 L865 855" marker-end="url(#arrow-lrs)"/>
  <text class="label" x="880" y="925">resep.id_kunjungan</text>

  <path class="line" d="M1320 1036 C1210 1036 1160 1080 1050 1080" marker-end="url(#arrow-lrs)"/>
  <text class="label" x="1130" y="1048">detail.id_resep</text>

  <path class="line" d="M1320 1062 L1165 1062 L1165 1270 L500 1270 L500 690 L470 690" marker-end="url(#arrow-lrs)"/>
  <text class="label" x="800" y="1250">detail.id_obat</text>

  <path class="line" d="M265 980 L265 845" marker-end="url(#arrow-lrs)"/>
  <text class="label" x="280" y="925">mutasi.id_obat</text>
</svg>
